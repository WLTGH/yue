<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>月矿统计</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(900px 320px at 0% -10%, rgba(59,130,246,.12), transparent 55%),
        radial-gradient(700px 280px at 100% 0%, rgba(34,160,107,.10), transparent 50%),
        #f3f5f9;
      color: #1a1a1a;
      font-size: 14px;
    }
    .app {
      max-width: 700px;
      margin: 0 auto;
      padding: 18px 12px 40px;
    }
    h1 {
      margin: 8px 0 4px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .2px;
      line-height: 1.3;
      -webkit-font-smoothing: antialiased;
    }
    .sub {
      display: block;
      margin: 0 0 14px;
      color: #6b7280;
      font-size: 13px;
    }
    .card {
      background: rgba(255,255,255,.92);
      border: 1px solid #e2e6ef;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 6px 18px rgba(20, 30, 50, .05);
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 650;
      color: #2d3748;
    }
    label {
      display: block;
      font-size: 12px;
      color: #7a8494;
      margin-bottom: 4px;
    }
    input, button, select { font: inherit; }
    input[type="text"], input[type="number"], input[type="date"] {
      width: 100%;
      border: 1px solid #d7dce6;
      border-radius: 8px;
      padding: 9px 11px;
      background: #fff;
    }
    input:focus {
      outline: none;
      border-color: #5b8def;
      box-shadow: 0 0 0 3px rgba(91,141,239,.18);
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: end;
      margin-bottom: 8px;
    }
    .row > div { flex: 1; min-width: 0; }
    .btn {
      border: 1px solid #c5d4f0;
      border-radius: 8px;
      padding: 9px 12px;
      background: #eaf1fc;
      color: #3a5f9a;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: none;
    }
    .btn:active { background: #dce7f8; }
    .btn.green {
      background: #e6f5ec;
      border-color: #b7dcc6;
      color: #2f7a4e;
    }
    .btn.gray {
      background: #f3f4f7;
      border-color: #d9dde6;
      color: #555;
    }
    .btn.red {
      background: #fdeeee;
      border-color: #f0c4c4;
      color: #b44747;
    }
    .btn.small { padding: 5px 8px; font-size: 12px; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #e3e7f0;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 13px;
      background: #f7f9fc;
    }
    .chip input[type="checkbox"] {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: #3b82f6;
    }
    .drawer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .drawer {
      border: 1px solid #e3e7f0;
      border-radius: 10px;
      margin-top: 8px;
      overflow: hidden;
      background: #f7f9fc;
    }
    .drawer-head {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border: 0;
      background: linear-gradient(180deg, #f3f6fb, #edf1f7);
      color: #222;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
    }
    .drawer-head:hover { filter: brightness(.98); }
    .drawer-head .arrow {
      transition: transform .2s ease;
      color: #8a94a6;
      font-size: 11px;
    }
    .drawer.open .drawer-head .arrow { transform: rotate(180deg); }
    .drawer-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .22s ease;
      background: #fff;
    }
    .drawer.open .drawer-body { grid-template-rows: 1fr; }
    .drawer-body-inner { overflow: hidden; min-height: 0; }
    .drawer-body-inner > .chips {
      padding: 10px 12px 12px;
      border-top: 1px solid #e8ebf0;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid #e3e7f0;
      border-radius: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 420px;
    }
    th, td {
      border-bottom: 1px solid #eef0f5;
      padding: 8px 6px;
      font-size: 13px;
      text-align: center;
    }
    th {
      background: #f4f7fc;
      font-weight: 650;
      color: #334;
    }
    td input {
      padding: 6px 4px;
      text-align: center;
      border-radius: 6px;
    }
    .hint {
      color: #8a94a6;
      font-size: 12px;
      margin: 6px 0 0;
    }
    .chart-box {
      position: relative;
      width: 100%;
      height: 280px;
    }
    .chart-box canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>月矿统计</h1>
    <p class="sub">记每周数据，自动画折线</p>

    <div class="card">
      <h2>角色</h2>
      <div class="row">
        <div>
          <label>名称</label>
          <input id="seriesName" type="text" placeholder="角色名" />
        </div>
        <button class="btn" id="addSeriesBtn">添加</button>
      </div>
      <div class="drawer" id="seriesDrawer">
        <button type="button" class="drawer-head" id="seriesDrawerBtn">
          <span id="seriesDrawerTitle">角色列表（0）</span>
          <span class="arrow">▼</span>
        </button>
        <div class="drawer-body">
          <div class="drawer-body-inner">
            <div style="padding:10px 12px 0;">
              <div class="drawer-actions">
                <button type="button" class="btn gray small" id="selectAllSeriesBtn">全选</button>
                <button type="button" class="btn gray small" id="clearSeriesSelBtn">清空勾选</button>
                <button type="button" class="btn small" id="exportSelectedBtn">导出勾选</button>
              </div>
            </div>
            <div class="chips" id="seriesChips"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>日期</h2>
      <div class="row">
        <div>
          <label>日期</label>
          <input id="oneDate" type="date" />
        </div>
        <button class="btn green" id="addDateBtn">添加日期</button>
      </div>
      <div class="drawer" id="dateDrawer">
        <button type="button" class="drawer-head" id="dateDrawerBtn">
          <span id="dateDrawerTitle">日期列表（0）</span>
          <span class="arrow">▼</span>
        </button>
        <div class="drawer-body">
          <div class="drawer-body-inner">
            <div style="padding:10px 12px 0;">
              <div class="drawer-actions">
                <button type="button" class="btn gray small" id="selectAllDatesBtn">全选</button>
                <button type="button" class="btn gray small" id="clearDatesSelBtn">清空勾选</button>
              </div>
              <p class="hint" style="margin:0 0 6px;">勾选后，导出会只包含这些日期；不勾选则导出全部日期。</p>
            </div>
            <div class="chips" id="dateChips"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>表格</h2>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>折线图</h2>
      <div class="chart-box">
        <canvas id="chart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="actions">
        <button class="btn small" id="exportImgBtn">导出图片</button>
        <button class="btn gray small" id="exportBtn">导出 JSON</button>
        <button class="btn gray small" id="importBtn">导入 JSON</button>
        <button class="btn red small" id="clearBtn">清空数据</button>
        <input id="importFile" type="file" accept="application/json" hidden />
      </div>
    </div>
  </div>

<script>
const COLORS = ["#3b82f6", "#16a34a", "#f59e0b", "#ef4444", "#8b5cf6", "#06b6d4", "#f97316"];
const storeKey = "moon-ore-stats-v2";

const state = { series: [], dates: [], values: {} };
const selectedSeries = new Set();
const selectedDates = new Set();

function fmtMD(iso) {
  if (!iso) return "";
  const parts = iso.split("-");
  return parts[1] + "/" + parts[2];
}
function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

function load() {
  try {
    const raw = localStorage.getItem(storeKey);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    state.series = parsed.series || [];
    state.dates = parsed.dates || [];
    state.values = parsed.values || {};
    return state.series.length > 0 || state.dates.length > 0;
  } catch { return false; }
}

function save() {
  localStorage.setItem(storeKey, JSON.stringify(state));
}

function ensure(date, series) {
  if (!state.values[date]) state.values[date] = {};
  if (state.values[date][series] === undefined) state.values[date][series] = "";
}

function addSeries(name) {
  name = (name || "").trim();
  if (!name) return alert("请输入名称");
  if (state.series.includes(name)) return alert("该系列已存在");
  state.series.push(name);
  state.dates.forEach(d => ensure(d, name));
  save(); render();
}

function removeSeries(name) {
  state.series = state.series.filter(s => s !== name);
  Object.keys(state.values).forEach(d => delete state.values[d][name]);
  selectedSeries.delete(name);
  save(); render();
}

function addDate(date) {
  if (!date) return alert("请选择日期");
  if (state.dates.includes(date)) return alert("该日期已存在");
  state.dates.push(date);
  state.dates.sort();
  state.series.forEach(s => ensure(date, s));
  save(); render();
}

function removeDate(date) {
  state.dates = state.dates.filter(d => d !== date);
  delete state.values[date];
  selectedDates.delete(date);
  save(); render();
}

function getExportDates(dateFilter) {
  if (Array.isArray(dateFilter) && dateFilter.length) {
    return dateFilter.filter(d => state.dates.includes(d));
  }
  const picked = state.dates.filter(d => selectedDates.has(d));
  return picked.length ? picked : state.dates.slice();
}

function getExportSeries(seriesFilter) {
  if (typeof seriesFilter === "string" && seriesFilter) {
    return state.series.includes(seriesFilter) ? [seriesFilter] : [];
  }
  if (Array.isArray(seriesFilter) && seriesFilter.length) {
    return seriesFilter.filter(s => state.series.includes(s));
  }
  const picked = state.series.filter(s => selectedSeries.has(s));
  return picked.length ? picked : state.series.slice();
}

function renderDateChips() {
  const box = document.getElementById("dateChips");
  const title = document.getElementById("dateDrawerTitle");
  box.innerHTML = "";
  const selCount = state.dates.filter(d => selectedDates.has(d)).length;
  title.textContent = "日期列表（" + state.dates.length + "）" + (selCount ? " · 已勾选 " + selCount : "");
  if (!state.dates.length) {
    box.innerHTML = '<span class="hint">还没有日期</span>';
    return;
  }
  state.dates.forEach(date => {
    const el = document.createElement("div");
    el.className = "chip";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selectedDates.has(date);
    cb.onchange = () => {
      if (cb.checked) selectedDates.add(date);
      else selectedDates.delete(date);
      renderDateChips();
    };
    el.appendChild(cb);
    const label = document.createElement("span");
    label.textContent = fmtMD(date);
    el.appendChild(label);
    const btn = document.createElement("button");
    btn.className = "btn red small";
    btn.textContent = "删";
    btn.onclick = () => removeDate(date);
    el.appendChild(btn);
    box.appendChild(el);
  });
}

function setValue(date, series, value) {
  ensure(date, series);
  state.values[date][series] = value;
  save();
  updateChart();
}

function renderChips() {
  const box = document.getElementById("seriesChips");
  const title = document.getElementById("seriesDrawerTitle");
  box.innerHTML = "";
  const selCount = state.series.filter(s => selectedSeries.has(s)).length;
  title.textContent = "角色列表（" + state.series.length + "）" + (selCount ? " · 已勾选 " + selCount : "");
  if (!state.series.length) {
    box.innerHTML = '<span class="hint">还没有角色</span>';
    return;
  }
  state.series.forEach((name, i) => {
    if (!state.series.includes(name)) selectedSeries.delete(name);
    const el = document.createElement("div");
    el.className = "chip";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selectedSeries.has(name);
    cb.onchange = () => {
      if (cb.checked) selectedSeries.add(name);
      else selectedSeries.delete(name);
      renderChips();
    };
    el.appendChild(cb);
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = COLORS[i % COLORS.length];
    el.appendChild(dot);
    const label = document.createElement("span");
    label.textContent = name;
    el.appendChild(label);
    const exp = document.createElement("button");
    exp.type = "button";
    exp.className = "btn small";
    exp.textContent = "导出";
    exp.onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      exportImage([name]);
    };
    el.appendChild(exp);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn red small";
    btn.textContent = "删";
    btn.onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      removeSeries(name);
    };
    el.appendChild(btn);
    box.appendChild(el);
  });
}

function renderTable() {
  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");
  thead.innerHTML = "";
  tbody.innerHTML = "";

  const trh = document.createElement("tr");
  trh.innerHTML = "<th>日期</th>" + state.series.map(s => "<th>" + s + "</th>").join("");
  thead.appendChild(trh);

  state.dates.forEach(date => {
    const tr = document.createElement("tr");
    const dateTd = document.createElement("td");
    dateTd.innerHTML = "<div style=\"display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;\"><b>" + fmtMD(date) + "</b></div>";
    const del = document.createElement("button");
    del.className = "btn red small";
    del.textContent = "删";
    del.onclick = () => removeDate(date);
    dateTd.firstChild.appendChild(del);
    tr.appendChild(dateTd);
    state.series.forEach(series => {
      const td = document.createElement("td");
      const input = document.createElement("input");
      input.type = "number";
      input.step = "any";
      input.value = state.values[date] && state.values[date][series] != null ? state.values[date][series] : "";
      input.addEventListener("input", () => setValue(date, series, input.value));
      td.appendChild(input);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

const lineNamePlugin = {
  id: "lineNamePlugin",
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (!meta || meta.hidden) return;
      let last = null;
      meta.data.forEach((pt, idx) => {
        const val = ds.data[idx];
        if (val == null || !Number.isFinite(Number(val)) || !pt) return;
        last = pt;
        ctx.save();
        ctx.font = "bold 11px PingFang SC, Noto Sans SC, sans-serif";
        ctx.fillStyle = ds.borderColor;
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText(String(val), Math.round(pt.x), Math.round(pt.y - 10));
        ctx.restore();
      });
      if (!last) return;
      ctx.save();
      ctx.font = "bold 12px PingFang SC, Microsoft YaHei, sans-serif";
      ctx.fillStyle = ds.borderColor;
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      ctx.fillText(ds.label, Math.round(last.x + 10), Math.round(last.y));
      ctx.restore();
    });
  }
};

function buildDatasets(seriesList, dateList) {
  const list = seriesList && seriesList.length ? seriesList : state.series;
  const dates = dateList && dateList.length ? dateList : state.dates;
  return list.map((name) => {
    const i = Math.max(0, state.series.indexOf(name));
    return {
      label: name,
      data: dates.map(d => {
        const v = state.values[d] ? state.values[d][name] : "";
        if (v === "" || v == null) return null;
        const n = Number(v);
        return Number.isFinite(n) ? n : null;
      }),
      borderColor: COLORS[i % COLORS.length],
      backgroundColor: COLORS[i % COLORS.length] + "33",
      tension: 0.25,
      spanGaps: true,
      pointRadius: 5,
      borderWidth: 2,
      clip: false
    };
  });
}

let chart;
let chartResizeTimer = null;

function getChartDpr() {
  const d = window.devicePixelRatio || 1;
  return Math.max(2, Math.min(3, d));
}

function updateChart() {
  const labels = state.dates.map(fmtMD);
  const datasets = buildDatasets().map(ds => Object.assign({}, ds, {
    borderWidth: 2.5,
    pointRadius: 4,
    pointHoverRadius: 4
  }));
  const canvas = document.getElementById("chart");
  const box = canvas.parentElement;
  const cssW = Math.max(280, Math.floor(box.clientWidth || box.offsetWidth || 320));
  const cssH = Math.max(200, Math.floor(box.clientHeight || 280));
  const dpr = getChartDpr();

  if (chart) {
    chart.destroy();
    chart = null;
  }

  // 只设 CSS 尺寸，由 Chart.js 按 devicePixelRatio 生成高清缓冲，避免重复放大发糊
  canvas.removeAttribute("width");
  canvas.removeAttribute("height");
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";

  chart = new Chart(canvas, {
    type: "line",
    data: { labels, datasets },
    plugins: [lineNamePlugin],
    options: {
      responsive: false,
      animation: false,
      devicePixelRatio: dpr,
      layout: { padding: { right: 88, top: 24, left: 6, bottom: 8 } },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false }
      },
      events: [],
      scales: {
        x: {
          offset: true,
          ticks: {
            autoSkip: false,
            maxRotation: 0,
            color: "#374151",
            font: { size: 12, weight: "500" }
          },
          grid: { color: "rgba(0,0,0,.06)" }
        },
        y: {
          beginAtZero: false,
          grace: "10%",
          ticks: {
            color: "#374151",
            font: { size: 12, weight: "500" }
          },
          grid: { color: "rgba(0,0,0,.06)" }
        }
      }
    }
  });
}

window.addEventListener("resize", () => {
  clearTimeout(chartResizeTimer);
  chartResizeTimer = setTimeout(() => {
    if (state.dates.length) updateChart();
  }, 120);
});

function render() {
  renderChips();
  renderDateChips();
  renderTable();
  updateChart();
}

document.getElementById("seriesDrawerBtn").onclick = () => {
  document.getElementById("seriesDrawer").classList.toggle("open");
};
document.getElementById("dateDrawerBtn").onclick = () => {
  document.getElementById("dateDrawer").classList.toggle("open");
};
document.getElementById("selectAllSeriesBtn").onclick = () => {
  state.series.forEach(s => selectedSeries.add(s));
  renderChips();
};
document.getElementById("clearSeriesSelBtn").onclick = () => {
  selectedSeries.clear();
  renderChips();
};
document.getElementById("selectAllDatesBtn").onclick = () => {
  state.dates.forEach(d => selectedDates.add(d));
  renderDateChips();
};
document.getElementById("clearDatesSelBtn").onclick = () => {
  selectedDates.clear();
  renderDateChips();
};
document.getElementById("exportSelectedBtn").onclick = () => {
  const list = state.series.filter(s => selectedSeries.has(s));
  if (!list.length) return alert("请先勾选要导出的角色");
  exportImage(list.slice());
};
document.getElementById("addSeriesBtn").onclick = () => {
  addSeries(document.getElementById("seriesName").value);
  document.getElementById("seriesName").value = "";
};
document.getElementById("seriesName").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("addSeriesBtn").click();
});
document.getElementById("addDateBtn").onclick = () => addDate(document.getElementById("oneDate").value);
document.getElementById("clearBtn").onclick = () => {
  if (!confirm("确定清空全部数据？")) return;
  state.series = [];
  state.dates = [];
  state.values = {};
  save(); render();
};
function exportImage(seriesFilter, dateFilter) {
  if (!state.dates.length || !state.series.length) {
    alert("请先添加日期和数据");
    return;
  }
  // 显式传入角色时只导出这些；未传参时若有勾选角色则用勾选，否则全部
  const hasExplicitSeries = (typeof seriesFilter === "string" && seriesFilter)
    || (Array.isArray(seriesFilter) && seriesFilter.length > 0);
  const seriesList = hasExplicitSeries
    ? getExportSeries(seriesFilter)
    : (state.series.filter(s => selectedSeries.has(s)).length
        ? state.series.filter(s => selectedSeries.has(s))
        : state.series.slice());
  if (!seriesList.length) {
    alert("没有可导出的角色");
    return;
  }
  const dateList = getExportDates(dateFilter);
  if (!dateList.length) {
    alert("没有可导出的日期");
    return;
  }
  const single = seriesList.length === 1;
  const cols = ["日期"].concat(seriesList);
  const rows = dateList.map(date => {
    return [fmtMD(date)].concat(seriesList.map(s => {
      const v = state.values[date] ? state.values[date][s] : "";
      return v == null || v === "" ? "-" : String(v);
    }));
  });

  const scale = 3;
  const width = single ? 1200 : 1600;
  const pad = 56;
  const titleH = 90;
  const colW = (width - pad * 2) / cols.length;
  const rowH = 52;
  const tableH = rowH * (rows.length + 1);
  const chartBoxW = width - pad * 2;
  const chartH = 520;
  const gap = 36;
  const height = pad + titleH + tableH + gap + chartH + pad;

  const canvas = document.createElement("canvas");
  canvas.width = width * scale;
  canvas.height = height * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = "#111827";
  ctx.font = "bold 40px PingFang SC, Noto Sans SC, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(single ? ("月矿统计 · " + seriesList[0]) : "月矿统计", width / 2, pad + 38);
  ctx.fillStyle = "#6b7280";
  ctx.font = "20px PingFang SC, Noto Sans SC, sans-serif";
  ctx.fillText(single ? seriesList[0] + " · 表+图" : "表 + 图", width / 2, pad + 70);

  const tableX = pad;
  const tableY = pad + titleH;

  cols.forEach((c, i) => {
    const x = tableX + i * colW;
    ctx.fillStyle = "#f3f4f6";
    ctx.fillRect(x, tableY, colW, rowH);
    ctx.strokeStyle = "#d1d5db";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x, tableY, colW, rowH);
    ctx.fillStyle = "#111827";
    ctx.font = "bold 22px PingFang SC, Noto Sans SC, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(c, x + colW / 2, tableY + rowH / 2);
  });

  rows.forEach((r, ri) => {
    r.forEach((cell, i) => {
      const x = tableX + i * colW;
      const y = tableY + (ri + 1) * rowH;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x, y, colW, rowH);
      ctx.strokeStyle = "#d1d5db";
      ctx.strokeRect(x, y, colW, rowH);
      let color = "#111827";
      if (i > 0) {
        const sName = seriesList[i - 1];
        const si = Math.max(0, state.series.indexOf(sName));
        color = COLORS[si % COLORS.length];
      }
      ctx.fillStyle = color;
      ctx.font = (i === 0 ? "bold " : "") + "22px PingFang SC, Noto Sans SC, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(cell, x + colW / 2, y + rowH / 2);
    });
  });

  const hold = document.createElement("canvas");
  hold.width = chartBoxW;
  hold.height = chartH;
  hold.style.position = "fixed";
  hold.style.left = "-9999px";
  document.body.appendChild(hold);

  const hi = new Chart(hold, {
    type: "line",
    data: {
      labels: dateList.map(fmtMD),
      datasets: buildDatasets(seriesList, dateList).map(ds => Object.assign({}, ds, { pointRadius: 6, borderWidth: 3 }))
    },
    plugins: [lineNamePlugin],
    options: {
      animation: false,
      responsive: false,
      maintainAspectRatio: false,
      devicePixelRatio: 3,
      layout: { padding: { right: 100, top: 28, left: 8, bottom: 10 } },
      plugins: { legend: { display: false } },
      scales: {
        x: { offset: true, ticks: { autoSkip: false, maxRotation: 0, color: "#374151", font: { size: 16 } } },
        y: { beginAtZero: false, grace: "8%", ticks: { color: "#374151", font: { size: 16 } } }
      }
    }
  });

  requestAnimationFrame(() => {
    const y = tableY + tableH + gap;
    ctx.drawImage(hold, pad, y, chartBoxW, chartH);
    downloadCanvas(canvas, single ? ("月矿统计-" + seriesList[0] + ".png") : "月矿统计.png");
    hi.destroy();
    hold.remove();
  });
}

function downloadCanvas(canvas, filename) {
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = filename || "月矿统计.png";
  a.click();
}

document.getElementById("exportImgBtn").onclick = () => {
  // 底部按钮：有勾选角色就导出勾选，否则全部；日期同理
  const seriesList = state.series.filter(s => selectedSeries.has(s));
  exportImage(seriesList.length ? seriesList.slice() : state.series.slice());
};
document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "月矿统计.json";
  a.click();
};
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      state.series = parsed.series || [];
      state.dates = parsed.dates || [];
      state.values = parsed.values || {};
      save(); render();
    } catch { alert("JSON 格式不正确"); }
  };
  reader.readAsText(file);
  e.target.value = "";
};

document.getElementById("oneDate").value = todayISO();

if (!load()) {
  state.series = ["WLT", "断剑重铸之日", "亚当"];
  state.dates = ["2026-08-12", "2026-08-19", "2026-08-26", "2026-09-01"];
  state.values = {
    "2026-08-12": { "WLT": 2635, "断剑重铸之日": 2508, "亚当": 2766 },
    "2026-08-19": { "WLT": 2712, "断剑重铸之日": 2583, "亚当": 2841 },
    "2026-08-26": { "WLT": 2760, "断剑重铸之日": 2556, "亚当": 2912 },
    "2026-09-01": { "WLT": 2781, "断剑重铸之日": 2550, "亚当": 2955 }
  };
  save();
}
render();
</script>
