<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>月矿统计 🌙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg-1: #fdf6f2;
      --bg-2: #f6e8ec;
      --bg-3: #efe6ee;
      --card-bg: rgba(255, 253, 251, .88);
      --card-border: #ecdfe0;
      --text: #4a3b42;
      --muted: #a4919a;
      --pink: #c98a9c;
      --pink-deep: #b06a80;
      --pink-soft: #f2dee3;
      --violet: #a79bc4;
      --violet-soft: #e9e2ef;
      --mint: #8fb3a0;
      --mint-soft: #dfeae3;
      --peach: #d9a66c;
      --peach-soft: #f3e6d2;
      --coral: #c98576;
      --coral-soft: #f1ddd6;
      --grid-line: rgba(169, 120, 140, .14);
      --input-bg: #fffdfb;
      --shadow-color: rgba(150, 110, 120, .14);
      --chip-bg: #faf1f0;
      --table-head: linear-gradient(180deg, #f7e9ec, #f2dfe4);
      --table-row-alt: #fbf3f1;
      --sparkle-opacity: .35;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-1: #211a26;
        --bg-2: #2b2130;
        --bg-3: #1c1622;
        --card-bg: rgba(43, 33, 48, .72);
        --card-border: #443648;
        --text: #ecdfe6;
        --muted: #b3a0ac;
        --pink: #d99cae;
        --pink-deep: #c97f95;
        --pink-soft: #3c2c34;
        --violet: #b7a6d1;
        --violet-soft: #362c44;
        --mint: #9fc3b1;
        --mint-soft: #253830;
        --peach: #e0b881;
        --peach-soft: #3c2f20;
        --coral: #d99a8c;
        --coral-soft: #3c2b27;
        --grid-line: rgba(217, 156, 174, .16);
        --input-bg: #2a2130;
        --shadow-color: rgba(0, 0, 0, .35);
        --chip-bg: #322833;
        --table-head: linear-gradient(180deg, #3a2d3c, #332833);
        --table-row-alt: #2a212c;
        --sparkle-opacity: .7;
      }
    }
    :root[data-theme="dark"] {
      --bg-1: #211a26; --bg-2: #2b2130; --bg-3: #1c1622;
      --card-bg: rgba(43, 33, 48, .72); --card-border: #443648;
      --text: #ecdfe6; --muted: #b3a0ac;
      --pink: #d99cae; --pink-deep: #c97f95; --pink-soft: #3c2c34;
      --violet: #b7a6d1; --violet-soft: #362c44;
      --mint: #9fc3b1; --mint-soft: #253830;
      --peach: #e0b881; --peach-soft: #3c2f20;
      --coral: #d99a8c; --coral-soft: #3c2b27;
      --grid-line: rgba(217, 156, 174, .16);
      --input-bg: #2a2130; --shadow-color: rgba(0,0,0,.35);
      --chip-bg: #322833; --table-head: linear-gradient(180deg, #3a2d3c, #332833);
      --table-row-alt: #2a212c; --sparkle-opacity: .7;
    }

    * { box-sizing: border-box; }
    html, body { background: var(--bg-1); }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      margin: 0;
      font-family: "Quicksand", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(700px 320px at 8% -8%, var(--bg-2), transparent 55%),
        radial-gradient(620px 300px at 100% 0%, var(--bg-3), transparent 55%),
        var(--bg-1);
      color: var(--text);
      font-size: 14px;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      position: relative;
      overflow-x: hidden;
      transition: background-color .3s ease, color .3s ease;
    }

    /* ---- 装饰性背景：漂浮的小星星与月牙，纯装饰不影响交互 ---- */
    .sky-deco {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: var(--sparkle-opacity);
    }
    .sky-deco span {
      position: absolute;
      font-size: 18px;
      filter: drop-shadow(0 0 6px var(--shadow-color));
      animation: floaty 7s ease-in-out infinite;
      opacity: .5;
    }
    .sky-deco span:nth-child(1) { top: 6%; left: 8%; font-size: 22px; animation-delay: 0s; }
    .sky-deco span:nth-child(2) { top: 14%; left: 82%; font-size: 14px; animation-delay: 1.1s; }
    .sky-deco span:nth-child(3) { top: 34%; left: 92%; font-size: 16px; animation-delay: 2.3s; }
    .sky-deco span:nth-child(4) { top: 58%; left: 4%; font-size: 15px; animation-delay: .6s; }
    .sky-deco span:nth-child(5) { top: 78%; left: 88%; font-size: 20px; animation-delay: 1.8s; }
    .sky-deco span:nth-child(6) { top: 90%; left: 12%; font-size: 13px; animation-delay: 3s; }
    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(8deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 700px;
      margin: 0 auto;
      padding: 22px 14px 44px;
    }
    h1 {
      margin: 6px 0 2px;
      font-family: "Baloo 2", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: .2px;
      line-height: 1.3;
      background: linear-gradient(90deg, var(--pink-deep), var(--violet) 85%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sub {
      display: block;
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(6px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 10px 26px var(--shadow-color);
      transition: background-color .3s ease, border-color .3s ease;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card h2 .ico { font-size: 16px; }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
    }
    input, button, select { font: inherit; }
    input[type="text"], input[type="number"], input[type="date"] {
      width: 100%;
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      background: var(--input-bg);
      color: var(--text);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--pink);
      box-shadow: 0 0 0 4px var(--pink-soft);
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: end;
      margin-bottom: 8px;
    }
    .row > div { flex: 1; min-width: 0; }

    /* ---- 按钮：圆润渐变糖果风 ---- */
    .btn {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 10px 16px;
      background: var(--pink-deep);
      color: #fff9fa;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--shadow-color);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: scale(.96); box-shadow: 0 2px 6px var(--shadow-color); }
    .btn.green {
      background: var(--mint);
      color: #23392f;
    }
    .btn.gray {
      background: var(--violet-soft);
      color: var(--violet);
      box-shadow: none;
      border-color: var(--card-border);
    }
    .btn.red {
      background: var(--coral-soft);
      color: var(--coral);
      box-shadow: none;
      border-color: var(--card-border);
    }
    .btn.small { padding: 6px 11px; font-size: 12px; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1.5px solid var(--card-border);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      background: var(--chip-bg);
      color: var(--text);
    }
    .chip input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--pink);
    }
    .drawer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px #fff, 0 0 6px var(--shadow-color);
    }
    :root[data-theme="dark"] .dot { box-shadow: 0 0 0 2px #2a1f3d, 0 0 6px var(--shadow-color); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .dot { box-shadow: 0 0 0 2px #2a1f3d, 0 0 6px var(--shadow-color); }
    }

    .drawer {
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      margin-top: 8px;
      overflow: hidden;
      background: var(--chip-bg);
    }
    .drawer-head {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 11px 14px;
      border: 0;
      background: var(--table-head);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
    }
    .drawer-head:hover { filter: brightness(1.02); }
    .drawer-head .arrow {
      transition: transform .2s ease;
      color: var(--pink);
      font-size: 12px;
    }
    .drawer.open .drawer-head .arrow { transform: rotate(180deg); }
    .drawer-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .22s ease;
      background: var(--card-bg);
    }
    .drawer.open .drawer-body { grid-template-rows: 1fr; }
    .drawer-body-inner { overflow: hidden; min-height: 0; }
    .drawer-body-inner > .chips {
      padding: 10px 12px 12px;
      border-top: 1px solid var(--card-border);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 420px;
    }
    th, td {
      border-bottom: 1px solid var(--card-border);
      padding: 9px 6px;
      font-size: 13px;
      text-align: center;
      color: var(--text);
    }
    th {
      background: var(--table-head);
      font-weight: 700;
    }
    tbody tr:nth-child(even) td { background: var(--table-row-alt); }
    td input {
      padding: 6px 4px;
      text-align: center;
      border-radius: 8px;
    }
    .hint {
      color: var(--muted);
      font-size: 12px;
      margin: 6px 0 0;
      font-weight: 500;
    }
    .chart-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .chart-box {
      position: relative;
      height: 280px;
      min-width: 100%;
    }
    .chart-box canvas {
      display: block;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="sky-deco" aria-hidden="true">
    <span>✨</span><span>⭐</span><span>💫</span><span>🌸</span><span>✨</span><span>⭐</span>
  </div>

  <div class="app">
    <h1><span>🌙</span>月矿统计<span>✨</span></h1>
    <p class="sub">记每周数据</p>

    <div class="card">
      <h2><span class="ico">🎀</span>角色</h2>
      <div class="row">
        <div>
          <label>名称</label>
          <input id="seriesName" type="text" placeholder="角色名" />
        </div>
        <button class="btn" id="addSeriesBtn">添加</button>
      </div>
      <div class="drawer" id="seriesDrawer">
        <button type="button" class="drawer-head" id="seriesDrawerBtn">
          <span id="seriesDrawerTitle">角色列表（0）</span>
          <span class="arrow">▾</span>
        </button>
        <div class="drawer-body">
          <div class="drawer-body-inner">
            <div style="padding:10px 12px 0;">
              <div class="drawer-actions">
                <button type="button" class="btn gray small" id="selectAllSeriesBtn">全选</button>
                <button type="button" class="btn gray small" id="clearSeriesSelBtn">清空勾选</button>
                <button type="button" class="btn small" id="exportSelectedBtn">导出勾选</button>
              </div>
            </div>
            <div class="chips" id="seriesChips"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2><span class="ico">🗓️</span>日期</h2>
      <div class="row">
        <div>
          <label>日期</label>
          <input id="oneDate" type="date" />
        </div>
        <button class="btn green" id="addDateBtn">添加日期</button>
      </div>
      <div class="drawer" id="dateDrawer">
        <button type="button" class="drawer-head" id="dateDrawerBtn">
          <span id="dateDrawerTitle">日期列表（0）</span>
          <span class="arrow">▾</span>
        </button>
        <div class="drawer-body">
          <div class="drawer-body-inner">
            <div style="padding:10px 12px 0;">
              <div class="drawer-actions">
                <button type="button" class="btn gray small" id="selectAllDatesBtn">全选</button>
                <button type="button" class="btn gray small" id="clearDatesSelBtn">清空勾选</button>
              </div>
              <p class="hint" style="margin:0 0 6px;">勾选后，导出会只包含这些日期；不勾选则导出全部日期。</p>
            </div>
            <div class="chips" id="dateChips"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2><span class="ico">📋</span>数据表格</h2>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2><span class="ico">🌈</span>趋势图</h2>
      <div class="chart-scroll">
        <div class="chart-box" id="chartBox">
          <canvas id="chart"></canvas>
        </div>
      </div>
    </div>

    <div class="card">
      <h2><span class="ico">💌</span>数据管理</h2>
      <div class="actions">
        <button class="btn small" id="exportImgBtn">导出图片</button>
        <button class="btn gray small" id="exportBtn">复制 JSON</button>
        <button class="btn gray small" id="importBtn">粘贴导入</button>
        <button class="btn red small" id="clearBtn">清空数据</button>
      </div>
    </div>
  </div>

<script>
const COLORS = ["#c98a9c", "#a79bc4", "#8fb3a0", "#d9a66c", "#8aa3c2", "#b98aa0", "#a68a6a"];
const storeKey = "moon-ore-stats-v2";

const state = { series: [], dates: [], values: {} };
const selectedSeries = new Set();
const selectedDates = new Set();

function fmtMD(iso) {
  if (!iso) return "";
  const parts = iso.split("-");
  return parts[1] + "/" + parts[2];
}
function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

function load() {
  try {
    const raw = localStorage.getItem(storeKey);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    state.series = parsed.series || [];
    state.dates = parsed.dates || [];
    state.values = parsed.values || {};
    return state.series.length > 0 || state.dates.length > 0;
  } catch { return false; }
}

function save() {
  localStorage.setItem(storeKey, JSON.stringify(state));
}

function ensure(date, series) {
  if (!state.values[date]) state.values[date] = {};
  if (state.values[date][series] === undefined) state.values[date][series] = "";
}

function addSeries(name) {
  name = (name || "").trim();
  if (!name) return alert("请输入名称");
  if (state.series.includes(name)) return alert("该系列已存在");
  state.series.push(name);
  state.dates.forEach(d => ensure(d, name));
  save(); render();
}

function removeSeries(name) {
  state.series = state.series.filter(s => s !== name);
  Object.keys(state.values).forEach(d => delete state.values[d][name]);
  selectedSeries.delete(name);
  save(); render();
}

function addDate(date) {
  if (!date) return alert("请选择日期");
  if (state.dates.includes(date)) return alert("该日期已存在");
  state.dates.push(date);
  state.dates.sort();
  state.series.forEach(s => ensure(date, s));
  save(); render();
}

function removeDate(date) {
  state.dates = state.dates.filter(d => d !== date);
  delete state.values[date];
  selectedDates.delete(date);
  save(); render();
}

function getExportDates(dateFilter) {
  if (Array.isArray(dateFilter) && dateFilter.length) {
    return dateFilter.filter(d => state.dates.includes(d));
  }
  const picked = state.dates.filter(d => selectedDates.has(d));
  return picked.length ? picked : state.dates.slice();
}

function getExportSeries(seriesFilter) {
  if (typeof seriesFilter === "string" && seriesFilter) {
    return state.series.includes(seriesFilter) ? [seriesFilter] : [];
  }
  if (Array.isArray(seriesFilter) && seriesFilter.length) {
    return seriesFilter.filter(s => state.series.includes(s));
  }
  const picked = state.series.filter(s => selectedSeries.has(s));
  return picked.length ? picked : state.series.slice();
}

function renderDateChips() {
  const box = document.getElementById("dateChips");
  const title = document.getElementById("dateDrawerTitle");
  box.innerHTML = "";
  const selCount = state.dates.filter(d => selectedDates.has(d)).length;
  title.textContent = "日期列表（" + state.dates.length + "）" + (selCount ? " · 已勾选 " + selCount : "");
  if (!state.dates.length) {
    box.innerHTML = '<span class="hint">还没有日期</span>';
    return;
  }
  state.dates.forEach(date => {
    const el = document.createElement("div");
    el.className = "chip";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selectedDates.has(date);
    cb.onchange = () => {
      if (cb.checked) selectedDates.add(date);
      else selectedDates.delete(date);
      renderDateChips();
    };
    el.appendChild(cb);
    const label = document.createElement("span");
    label.textContent = fmtMD(date);
    el.appendChild(label);
    const btn = document.createElement("button");
    btn.className = "btn red small";
    btn.textContent = "删";
    btn.onclick = () => removeDate(date);
    el.appendChild(btn);
    box.appendChild(el);
  });
}

function setValue(date, series, value) {
  ensure(date, series);
  state.values[date][series] = value;
  save();
  updateChart();
}

function renderChips() {
  const box = document.getElementById("seriesChips");
  const title = document.getElementById("seriesDrawerTitle");
  box.innerHTML = "";
  const selCount = state.series.filter(s => selectedSeries.has(s)).length;
  title.textContent = "角色列表（" + state.series.length + "）" + (selCount ? " · 已勾选 " + selCount : "");
  if (!state.series.length) {
    box.innerHTML = '<span class="hint">还没有角色</span>';
    return;
  }
  state.series.forEach((name, i) => {
    if (!state.series.includes(name)) selectedSeries.delete(name);
    const el = document.createElement("div");
    el.className = "chip";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selectedSeries.has(name);
    cb.onchange = () => {
      if (cb.checked) selectedSeries.add(name);
      else selectedSeries.delete(name);
      renderChips();
    };
    el.appendChild(cb);
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = COLORS[i % COLORS.length];
    el.appendChild(dot);
    const label = document.createElement("span");
    label.textContent = name;
    el.appendChild(label);
    const exp = document.createElement("button");
    exp.type = "button";
    exp.className = "btn small";
    exp.textContent = "导出";
    exp.onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      exportImage([name]);
    };
    el.appendChild(exp);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn red small";
    btn.textContent = "删";
    btn.onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      removeSeries(name);
    };
    el.appendChild(btn);
    box.appendChild(el);
  });
}

function renderTable() {
  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");
  thead.innerHTML = "";
  tbody.innerHTML = "";

  const trh = document.createElement("tr");
  trh.innerHTML = "<th>日期</th>" + state.series.map(s => "<th>" + s + "</th>").join("");
  thead.appendChild(trh);

  state.dates.forEach(date => {
    const tr = document.createElement("tr");
    const dateTd = document.createElement("td");
    dateTd.innerHTML = "<div style=\"display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;\"><b>" + fmtMD(date) + "</b></div>";
    const del = document.createElement("button");
    del.className = "btn red small";
    del.textContent = "删";
    del.onclick = () => removeDate(date);
    dateTd.firstChild.appendChild(del);
    tr.appendChild(dateTd);
    state.series.forEach(series => {
      const td = document.createElement("td");
      const input = document.createElement("input");
      input.type = "number";
      input.step = "any";
      input.value = state.values[date] && state.values[date][series] != null ? state.values[date][series] : "";
      input.addEventListener("input", () => setValue(date, series, input.value));
      td.appendChild(input);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

const lineNamePlugin = {
  id: "lineNamePlugin",
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (!meta || meta.hidden) return;
      let last = null;
      meta.data.forEach((pt, idx) => {
        const val = ds.data[idx];
        if (val == null || !Number.isFinite(Number(val)) || !pt) return;
        last = pt;
        ctx.save();
        ctx.font = "bold 11px Quicksand, PingFang SC, Noto Sans SC, sans-serif";
        ctx.fillStyle = ds.borderColor;
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText(String(val), Math.round(pt.x), Math.round(pt.y - 10));
        ctx.restore();
      });
      if (!last) return;
      ctx.save();
      ctx.font = "bold 12px Quicksand, PingFang SC, Microsoft YaHei, sans-serif";
      ctx.fillStyle = ds.borderColor;
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      ctx.fillText(ds.label, Math.round(last.x + 10), Math.round(last.y));
      ctx.restore();
    });
  }
};

function buildDatasets(seriesList, dateList) {
  const list = seriesList && seriesList.length ? seriesList : state.series;
  const dates = dateList && dateList.length ? dateList : state.dates;
  return list.map((name) => {
    const i = Math.max(0, state.series.indexOf(name));
    return {
      label: name,
      data: dates.map(d => {
        const v = state.values[d] ? state.values[d][name] : "";
        if (v === "" || v == null) return null;
        const n = Number(v);
        return Number.isFinite(n) ? n : null;
      }),
      borderColor: COLORS[i % COLORS.length],
      backgroundColor: COLORS[i % COLORS.length] + "33",
      tension: 0.35,
      spanGaps: true,
      pointRadius: 5,
      borderWidth: 2,
      clip: false
    };
  });
}

let chart;
let chartResizeTimer = null;

function getChartDpr() {
  const d = window.devicePixelRatio || 1;
  return Math.max(2, Math.min(3, d));
}

function updateChart() {
  const labels = state.dates.map(fmtMD);
  const datasets = buildDatasets().map(ds => Object.assign({}, ds, {
    borderWidth: 2.5,
    pointRadius: 4,
    pointHoverRadius: 4
  }));
  const canvas = document.getElementById("chart");
  const box = document.getElementById("chartBox");
  const scroll = box.parentElement;
  const viewW = Math.max(280, Math.floor(scroll.clientWidth || 320));
  // 每个日期至少约 56px，数据多就加宽，可左右滑动
  const cssW = Math.max(viewW, labels.length * 56 + 110);
  const cssH = 280;
  const dpr = getChartDpr();
  const tickColor = getComputedStyle(document.documentElement).getPropertyValue("--text").trim() || "#5b4368";
  const gridColor = getComputedStyle(document.documentElement).getPropertyValue("--grid-line").trim() || "rgba(255,111,165,.12)";

  if (chart) {
    chart.destroy();
    chart = null;
  }

  box.style.width = cssW + "px";
  canvas.removeAttribute("width");
  canvas.removeAttribute("height");
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";

  chart = new Chart(canvas, {
    type: "line",
    data: { labels, datasets },
    plugins: [lineNamePlugin],
    options: {
      responsive: false,
      animation: false,
      devicePixelRatio: dpr,
      layout: { padding: { right: 88, top: 24, left: 6, bottom: 8 } },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false }
      },
      events: [],
      scales: {
        x: {
          offset: true,
          ticks: {
            autoSkip: false,
            maxRotation: 0,
            color: tickColor,
            font: { size: 11, weight: "500", family: "Quicksand" }
          },
          grid: { color: gridColor }
        },
        y: {
          beginAtZero: false,
          grace: "10%",
          ticks: {
            color: tickColor,
            font: { size: 12, weight: "500", family: "Quicksand" }
          },
          grid: { color: gridColor }
        }
      }
    }
  });
}

window.addEventListener("resize", () => {

function exportImage(seriesFilter, dateFilter) {
  if (!state.dates.length || !state.series.length) {
    alert("请先添加日期和数据");
    return;
  }
  // 显式传入角色时只导出这些；未传参时若有勾选角色则用勾选，否则全部
  const hasExplicitSeries = (typeof seriesFilter === "string" && seriesFilter)
    || (Array.isArray(seriesFilter) && seriesFilter.length > 0);
  const seriesList = hasExplicitSeries
    ? getExportSeries(seriesFilter)
    : (state.series.filter(s => selectedSeries.has(s)).length
        ? state.series.filter(s => selectedSeries.has(s))
        : state.series.slice());
  if (!seriesList.length) {
    alert("没有可导出的角色");
    return;
  }
  const dateList = getExportDates(dateFilter);
  if (!dateList.length) {
    alert("没有可导出的日期");
    return;
  }
  const single = seriesList.length === 1;
  const cols = ["日期"].concat(seriesList);
  const rows = dateList.map(date => {
    return [fmtMD(date)].concat(seriesList.map(s => {
      const v = state.values[date] ? state.values[date][s] : "";
      return v == null || v === "" ? "-" : String(v);
    }));
  });

  // 配色：与页面主题保持一致的低饱和莫兰迪少女色
  const INK = "#4a3b42";
  const MUTED = "#a4919a";
  const LINE = "#ecdfe0";
  const HEAD_BG_1 = "#f7e9ec";
  const HEAD_BG_2 = "#f2dfe4";
  const ROW_ALT = "#fbf3f1";
  const CARD_BG_1 = "#fffdfb";
  const CARD_BG_2 = "#faf1ee";
  const PAGE_BG_1 = "#fdf6f2";
  const PAGE_BG_2 = "#f3e8ea";
  const PANEL_BG = "#fcf5f2";
  const ACCENT_1 = "#b06a80";
  const ACCENT_2 = "#a79bc4";

  function roundRect(c, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  const scale = 3;
  const outerMargin = 30;   // 卡片与画布边缘的留白
  const pad = 44;           // 卡片内容内边距
  const cardRadius = 26;
  const titleH = 92;
  const dividerH = 46;
  const footerH = 40;
  const chartH = 440;
  const chartPad = 20;      // 折线图小面板内边距
  const rowH = 52;
  const tableH = rowH * (rows.length + 1);
  const minWidth = single ? 1100 : 1500;

  const contentW = Math.max(minWidth, dateList.length * 72 + 100) - pad * 2;
  const width = contentW + pad * 2 + outerMargin * 2;
  const colW = contentW / cols.length;
  const chartBoxW = contentW - chartPad * 2;
  const height = outerMargin * 2 + pad * 2 + titleH + tableH + dividerH + chartH + footerH;

  const cardX = outerMargin, cardY = outerMargin;
  const cardW = width - outerMargin * 2, cardH = height - outerMargin * 2;
  const contentX = cardX + pad;

  const canvas = document.createElement("canvas");
  canvas.width = width * scale;
  canvas.height = height * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  // 页面底色
  const pageGrad = ctx.createLinearGradient(0, 0, width, height);
  pageGrad.addColorStop(0, PAGE_BG_1);
  pageGrad.addColorStop(1, PAGE_BG_2);
  ctx.fillStyle = pageGrad;
  ctx.fillRect(0, 0, width, height);

  // 卡片主体（带柔和投影，把表格与折线图“装”进同一张卡片里）
  ctx.save();
  ctx.shadowColor = "rgba(150,110,120,.22)";
  ctx.shadowBlur = 34;
  ctx.shadowOffsetY = 12;
  const cardGrad = ctx.createLinearGradient(cardX, cardY, cardX, cardY + cardH);
  cardGrad.addColorStop(0, CARD_BG_1);
  cardGrad.addColorStop(1, CARD_BG_2);
  roundRect(ctx, cardX, cardY, cardW, cardH, cardRadius);
  ctx.fillStyle = cardGrad;
  ctx.fill();
  ctx.restore();

  // 标题
  let cursorY = cardY + pad;
  ctx.fillStyle = INK;
  ctx.font = "700 34px PingFang SC, Noto Sans SC, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(single ? ("月矿统计 · " + seriesList[0]) : "月矿统计", width / 2, cursorY + 32);
  ctx.fillStyle = MUTED;
  ctx.font = "500 17px PingFang SC, Noto Sans SC, sans-serif";
  ctx.fillText(single ? seriesList[0] + " · 数据一览" : "数据一览", width / 2, cursorY + 60);
  // 标题下的小小装饰线，呼应页面渐变标题
  const ruleGrad = ctx.createLinearGradient(width / 2 - 28, 0, width / 2 + 28, 0);
  ruleGrad.addColorStop(0, ACCENT_1);
  ruleGrad.addColorStop(1, ACCENT_2);
  roundRect(ctx, width / 2 - 28, cursorY + 74, 56, 3, 2);
  ctx.fillStyle = ruleGrad;
  ctx.fill();

  const tableY = cardY + pad + titleH;

  // 表头（圆角面板，不再是一格格独立描边，读起来更整体）
  roundRect(ctx, contentX, tableY, contentW, rowH, 14);
  const headGrad = ctx.createLinearGradient(contentX, tableY, contentX, tableY + rowH);
  headGrad.addColorStop(0, HEAD_BG_1);
  headGrad.addColorStop(1, HEAD_BG_2);
  ctx.fillStyle = headGrad;
  ctx.fill();
  cols.forEach((c, i) => {
    const x = contentX + i * colW;
    ctx.fillStyle = INK;
    ctx.font = "700 20px PingFang SC, Noto Sans SC, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(c, x + colW / 2, tableY + rowH / 2);
  });

  // 表格主体：只用横向分隔线 + 首列竖线，去掉满屏网格，视觉更干净
  rows.forEach((r, ri) => {
    const y = tableY + rowH + ri * rowH;
    if (ri % 2 === 1) {
      ctx.fillStyle = ROW_ALT;
      ctx.fillRect(contentX, y, contentW, rowH);
    }
    r.forEach((cell, i) => {
      const x = contentX + i * colW;
      let color = INK;
      if (i > 0) {
        const sName = seriesList[i - 1];
        const si = Math.max(0, state.series.indexOf(sName));
        color = COLORS[si % COLORS.length];
      }
      ctx.fillStyle = color;
      ctx.font = (i === 0 ? "700 " : "600 ") + "20px PingFang SC, Noto Sans SC, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(cell, x + colW / 2, y + rowH / 2);
    });
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(contentX, y + rowH);
    ctx.lineTo(contentX + contentW, y + rowH);
    ctx.stroke();
  });
  // 首列与数据列之间的分隔线，弱化但保留，方便对齐阅读
  ctx.strokeStyle = LINE;
  ctx.beginPath();
  ctx.moveTo(contentX + colW, tableY);
  ctx.lineTo(contentX + colW, tableY + tableH);
  ctx.stroke();
  roundRect(ctx, contentX, tableY, contentW, tableH, 14);
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 表格与折线图之间的“连接带”：一条渐变线 + 居中小标签，取代生硬的大片留白
  const dividerY = tableY + tableH + dividerH / 2;
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(contentX, dividerY);
  ctx.lineTo(contentX + contentW, dividerY);
  ctx.stroke();
  ctx.font = "600 15px PingFang SC, Noto Sans SC, sans-serif";
  const dividerLabel = "🌈 趋势图";
  const labelW = ctx.measureText(dividerLabel).width + 28;
  roundRect(ctx, width / 2 - labelW / 2, dividerY - 15, labelW, 30, 15);
  ctx.fillStyle = CARD_BG_1;
  ctx.fill();
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = ACCENT_1;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(dividerLabel, width / 2, dividerY + 1);

  // 折线图外层面板：与表格同宽、同圆角，视觉上和表格属于同一张卡片
  const panelY = tableY + tableH + dividerH;
  roundRect(ctx, contentX, panelY, contentW, chartH, 18);
  ctx.fillStyle = PANEL_BG;
  ctx.fill();
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  const hold = document.createElement("canvas");
  hold.width = chartBoxW;
  hold.height = chartH - chartPad * 2;
  hold.style.position = "fixed";
  hold.style.left = "-9999px";
  document.body.appendChild(hold);

  const hi = new Chart(hold, {
    type: "line",
    data: {
      labels: dateList.map(fmtMD),
      datasets: buildDatasets(seriesList, dateList).map(ds => Object.assign({}, ds, { pointRadius: 6, borderWidth: 3 }))
    },
    plugins: [lineNamePlugin],
    options: {
      animation: false,
      responsive: false,
      maintainAspectRatio: false,
      devicePixelRatio: 3,
      layout: { padding: { right: 96, top: 24, left: 8, bottom: 8 } },
      plugins: { legend: { display: false } },
      scales: {
        x: { offset: true, ticks: { autoSkip: false, maxRotation: 0, color: INK, font: { size: 13 } }, grid: { color: LINE } },
        y: { beginAtZero: false, grace: "8%", ticks: { color: INK, font: { size: 14 } }, grid: { color: LINE } }
      }
    }
  });

  requestAnimationFrame(() => {
    ctx.drawImage(hold, contentX + chartPad, panelY + chartPad, chartBoxW, chartH - chartPad * 2);
    // 底部落款，和页面标题呼应，让整张图更像一张完整的卡片而非拼接截图
    ctx.fillStyle = MUTED;
    ctx.font = "500 14px PingFang SC, Noto Sans SC, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🌙 月矿统计", width / 2, panelY + chartH + footerH / 2 + 6);
    downloadCanvas(canvas, single ? ("月矿统计-" + seriesList[0] + ".png") : "月矿统计.png");
    hi.destroy();
    hold.remove();
  });
}

function downloadCanvas(canvas, filename) {
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = filename || "月矿统计.png";
  a.click();
}

document.getElementById("exportImgBtn").onclick = () => {

  const seriesList = state.series.filter(s => selectedSeries.has(s));
  exportImage(seriesList.length ? seriesList.slice() : state.series.slice());
};
function applyImportedJson(text) {
  try {
    const parsed = JSON.parse(text);
    if (!parsed || typeof parsed !== "object") throw new Error("bad");
    state.series = Array.isArray(parsed.series) ? parsed.series : [];
    state.dates = Array.isArray(parsed.dates) ? parsed.dates : [];
    state.values = parsed.values && typeof parsed.values === "object" ? parsed.values : {};
    selectedSeries.clear();
    selectedDates.clear();
    save();
    render();
    alert("导入成功");
  } catch {
    alert("JSON 格式不正确");
  }
}

document.getElementById("exportBtn").onclick = async () => {
  const text = JSON.stringify(state, null, 2);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      alert("已复制到剪贴板");
      return;
    }
  } catch (_) {}
  // 兼容不支持剪贴板 API 的环境
  window.prompt("复制下面的 JSON：", text);
};

document.getElementById("importBtn").onclick = async () => {
  try {
    if (navigator.clipboard && navigator.clipboard.readText) {
      const text = await navigator.clipboard.readText();
      if (!text || !text.trim()) {
        alert("剪贴板是空的");
        return;
      }
      applyImportedJson(text);
      return;
    }
  } catch (_) {}
  const text = window.prompt("粘贴 JSON 内容：", "");
  if (text == null) return;
  if (!text.trim()) {
    alert("没有内容");
    return;
  }
  applyImportedJson(text);
};
