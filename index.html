<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>月矿统计</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --line: #e6e8ee;
      --text: #1c1c1e;
      --muted: #6b7280;
      --blue: #3b82f6;
      --green: #16a34a;
      --red: #ef4444;
      --shadow: 0 8px 24px rgba(15, 23, 42, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 14px 40px;
    }
    h1 {
      margin: 8px 0 4px;
      font-size: 22px;
      text-align: center;
    }
    .sub {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 15px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    input, button, select {
      font: inherit;
    }
    input[type="text"], input[type="number"], input[type="date"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: end;
      margin-bottom: 10px;
    }
    .row > div { flex: 1; min-width: 0; }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--blue);
      color: #fff;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn.green { background: var(--green); }
    .btn.gray { background: #eef1f6; color: #111827; }
    .btn.red { background: var(--red); }
    .btn.small { padding: 6px 8px; font-size: 12px; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 13px;
      background: #fafafa;
    }
    .chip input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--blue);
    }
    .drawer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .drawer {
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-top: 8px;
      overflow: hidden;
      background: #fafafa;
    }
    .drawer-head {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border: 0;
      background: #f3f4f6;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      text-align: left;
    }
    .drawer-head:hover { background: #eef1f6; }
    .drawer-head .arrow {
      transition: transform .25s ease;
      color: var(--muted);
      font-size: 12px;
    }
    .drawer.open .drawer-head .arrow { transform: rotate(180deg); }
    .drawer-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .28s ease;
      background: #fff;
    }
    .drawer.open .drawer-body {
      grid-template-rows: 1fr;
    }
    .drawer-body-inner {
      overflow: hidden;
      min-height: 0;
    }
    .drawer-body-inner > .chips {
      padding: 10px 12px 12px;
      border-top: 1px solid var(--line);
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 420px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
      font-size: 13px;
      text-align: center;
    }
    th { background: #f8fafc; font-weight: 650; }
    td input {
      padding: 7px 6px;
      text-align: center;
    }
    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      margin: 8px 0 0;
    }
    canvas { width: 100% !important; height: 420px !important; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>月矿统计</h1>
    <p class="sub">自定义日期，录入多角色数据，自动生成折线图</p>

    <div class="card">
      <h2>角色 / 数据系列</h2>
      <div class="row">
        <div>
          <label>名称</label>
          <input id="seriesName" type="text" placeholder="例如：WLT" />
        </div>
        <button class="btn" id="addSeriesBtn">添加</button>
      </div>
      <div class="drawer" id="seriesDrawer">
        <button type="button" class="drawer-head" id="seriesDrawerBtn">
          <span id="seriesDrawerTitle">角色列表（0）</span>
          <span class="arrow">▼</span>
        </button>
        <div class="drawer-body">
          <div class="drawer-body-inner">
            <div style="padding:10px 12px 0;">
              <div class="drawer-actions">
                <button type="button" class="btn gray small" id="selectAllSeriesBtn">全选</button>
                <button type="button" class="btn gray small" id="clearSeriesSelBtn">清空勾选</button>
                <button type="button" class="btn small" id="exportSelectedBtn">导出勾选</button>
              </div>
            </div>
            <div class="chips" id="seriesChips"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>添加日期</h2>
      <div class="row">
        <div>
          <label>日期</label>
          <input id="oneDate" type="date" />
        </div>
        <button class="btn green" id="addDateBtn">添加日期</button>
      </div>
      <div class="drawer" id="dateDrawer">
        <button type="button" class="drawer-head" id="dateDrawerBtn">
          <span id="dateDrawerTitle">日期列表（0）</span>
          <span class="arrow">▼</span>
        </button>
        <div class="drawer-body">
          <div class="drawer-body-inner">
            <div class="chips" id="dateChips"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>数据表</h2>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>折线图</h2>
      <canvas id="chart"></canvas>
    </div>

    <div class="card">
      <div class="actions">
        <button class="btn small" id="exportImgBtn">导出图片</button>
        <button class="btn gray small" id="exportBtn">导出 JSON</button>
        <button class="btn gray small" id="importBtn">导入 JSON</button>
        <button class="btn red small" id="clearBtn">清空数据</button>
        <input id="importFile" type="file" accept="application/json" hidden />
      </div>
    </div>
  </div>

<script>
const COLORS = ["#3b82f6", "#16a34a", "#f59e0b", "#ef4444", "#8b5cf6", "#06b6d4", "#f97316"];
const storeKey = "moon-ore-stats-v2";

const state = { series: [], dates: [], values: {} };
const selectedSeries = new Set();

function fmtMD(iso) {
  if (!iso) return "";
  const parts = iso.split("-");
  return parts[1] + "/" + parts[2];
}
function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

function load() {
  try {
    const raw = localStorage.getItem(storeKey);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    state.series = parsed.series || [];
    state.dates = parsed.dates || [];
    state.values = parsed.values || {};
    return state.series.length > 0 || state.dates.length > 0;
  } catch { return false; }
}

function save() {
  localStorage.setItem(storeKey, JSON.stringify(state));
}

function ensure(date, series) {
  if (!state.values[date]) state.values[date] = {};
  if (state.values[date][series] === undefined) state.values[date][series] = "";
}

function addSeries(name) {
  name = (name || "").trim();
  if (!name) return alert("请输入名称");
  if (state.series.includes(name)) return alert("该系列已存在");
  state.series.push(name);
  state.dates.forEach(d => ensure(d, name));
  save(); render();
}

function removeSeries(name) {
  state.series = state.series.filter(s => s !== name);
  Object.keys(state.values).forEach(d => delete state.values[d][name]);
  selectedSeries.delete(name);
  save(); render();
}

function addDate(date) {
  if (!date) return alert("请选择日期");
  if (state.dates.includes(date)) return alert("该日期已存在");
  state.dates.push(date);
  state.dates.sort();
  state.series.forEach(s => ensure(date, s));
  save(); render();
}

function removeDate(date) {
  state.dates = state.dates.filter(d => d !== date);
  delete state.values[date];
  save(); render();
}

function renderDateChips() {
  const box = document.getElementById("dateChips");
  const title = document.getElementById("dateDrawerTitle");
  box.innerHTML = "";
  title.textContent = "日期列表（" + state.dates.length + "）";
  if (!state.dates.length) {
    box.innerHTML = '<span class="hint">还没有日期</span>';
    return;
  }
  state.dates.forEach(date => {
    const el = document.createElement("div");
    el.className = "chip";
    el.innerHTML = "<span>" + fmtMD(date) + "</span>";
    const btn = document.createElement("button");
    btn.className = "btn red small";
    btn.textContent = "删";
    btn.onclick = () => removeDate(date);
    el.appendChild(btn);
    box.appendChild(el);
  });
}

function setValue(date, series, value) {
  ensure(date, series);
  state.values[date][series] = value;
  save();
  updateChart();
}

function renderChips() {
  const box = document.getElementById("seriesChips");
  const title = document.getElementById("seriesDrawerTitle");
  box.innerHTML = "";
  const selCount = state.series.filter(s => selectedSeries.has(s)).length;
  title.textContent = "角色列表（" + state.series.length + "）" + (selCount ? " · 已勾选 " + selCount : "");
  if (!state.series.length) {
    box.innerHTML = '<span class="hint">还没有角色</span>';
    return;
  }
  state.series.forEach((name, i) => {
    if (!state.series.includes(name)) selectedSeries.delete(name);
    const el = document.createElement("div");
    el.className = "chip";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selectedSeries.has(name);
    cb.onchange = () => {
      if (cb.checked) selectedSeries.add(name);
      else selectedSeries.delete(name);
      renderChips();
    };
    el.appendChild(cb);
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = COLORS[i % COLORS.length];
    el.appendChild(dot);
    const label = document.createElement("span");
    label.textContent = name;
    el.appendChild(label);
    const exp = document.createElement("button");
    exp.className = "btn small";
    exp.textContent = "导出";
    exp.onclick = () => exportImage([name]);
    el.appendChild(exp);
    const btn = document.createElement("button");
    btn.className = "btn red small";
    btn.textContent = "删";
    btn.onclick = () => removeSeries(name);
    el.appendChild(btn);
    box.appendChild(el);
  });
}

function renderTable() {
  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");
  thead.innerHTML = "";
  tbody.innerHTML = "";

  const trh = document.createElement("tr");
  trh.innerHTML = "<th>日期</th>" + state.series.map(s => "<th>" + s + "</th>").join("");
  thead.appendChild(trh);

  state.dates.forEach(date => {
    const tr = document.createElement("tr");
    const dateTd = document.createElement("td");
    dateTd.innerHTML = "<div style=\"display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;\"><b>" + fmtMD(date) + "</b></div>";
    const del = document.createElement("button");
    del.className = "btn red small";
    del.textContent = "删";
    del.onclick = () => removeDate(date);
    dateTd.firstChild.appendChild(del);
    tr.appendChild(dateTd);
    state.series.forEach(series => {
      const td = document.createElement("td");
      const input = document.createElement("input");
      input.type = "number";
      input.step = "any";
      input.value = state.values[date] && state.values[date][series] != null ? state.values[date][series] : "";
      input.addEventListener("input", () => setValue(date, series, input.value));
      td.appendChild(input);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

const lineNamePlugin = {
  id: "lineNamePlugin",
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (!meta || meta.hidden) return;
      let last = null;
      meta.data.forEach((pt, idx) => {
        const val = ds.data[idx];
        if (val == null || !Number.isFinite(Number(val)) || !pt) return;
        last = pt;
        ctx.save();
        ctx.font = "bold 11px PingFang SC, Noto Sans SC, sans-serif";
        ctx.fillStyle = ds.borderColor;
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        const lift = 8 + (i % 3) * 12;
        ctx.fillText(String(val), pt.x, pt.y - lift);
        ctx.restore();
      });
      if (!last) return;
      ctx.save();
      ctx.font = "bold 12px PingFang SC, Noto Sans SC, sans-serif";
      ctx.fillStyle = ds.borderColor;
      ctx.textBaseline = "bottom";
      ctx.textAlign = "center";
      ctx.fillText(ds.label, last.x, last.y - 22 - (i % 3) * 12);
      ctx.restore();
    });
  }
};

function buildDatasets(seriesList) {
  const list = seriesList && seriesList.length ? seriesList : state.series;
  return list.map((name) => {
    const i = Math.max(0, state.series.indexOf(name));
    return {
      label: name,
      data: state.dates.map(d => {
        const v = state.values[d] ? state.values[d][name] : "";
        if (v === "" || v == null) return null;
        const n = Number(v);
        return Number.isFinite(n) ? n : null;
      }),
      borderColor: COLORS[i % COLORS.length],
      backgroundColor: COLORS[i % COLORS.length] + "33",
      tension: 0.25,
      spanGaps: true,
      pointRadius: 5,
      borderWidth: 2,
      clip: false
    };
  });
}

let chart;
function updateChart() {
  const labels = state.dates.map(fmtMD);
  const datasets = buildDatasets();
  const ctx = document.getElementById("chart");
  if (chart) {
    chart.data.labels = labels;
    chart.data.datasets = datasets;
    chart.update();
    return;
  }
  chart = new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    plugins: [lineNamePlugin],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      devicePixelRatio: Math.max(2, window.devicePixelRatio || 1),
      layout: { padding: { right: 12, top: 36, left: 4, bottom: 4 } },
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false } },
      scales: {
        x: { offset: true, ticks: { autoSkip: false, maxRotation: 0, color: "#374151" } },
        y: { beginAtZero: false, grace: "8%", ticks: { color: "#374151" } }
      }
    }
  });
}

function render() {
  renderChips();
  renderDateChips();
  renderTable();
  updateChart();
}

document.getElementById("seriesDrawerBtn").onclick = () => {
  document.getElementById("seriesDrawer").classList.toggle("open");
};
document.getElementById("dateDrawerBtn").onclick = () => {
  document.getElementById("dateDrawer").classList.toggle("open");
};
document.getElementById("selectAllSeriesBtn").onclick = () => {
  state.series.forEach(s => selectedSeries.add(s));
  renderChips();
};
document.getElementById("clearSeriesSelBtn").onclick = () => {
  selectedSeries.clear();
  renderChips();
};
document.getElementById("exportSelectedBtn").onclick = () => {
  const list = state.series.filter(s => selectedSeries.has(s));
  if (!list.length) return alert("请先勾选要导出的角色");
  exportImage(list);
};
document.getElementById("addSeriesBtn").onclick = () => {
  addSeries(document.getElementById("seriesName").value);
  document.getElementById("seriesName").value = "";
};
document.getElementById("seriesName").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("addSeriesBtn").click();
});
document.getElementById("addDateBtn").onclick = () => addDate(document.getElementById("oneDate").value);
document.getElementById("clearBtn").onclick = () => {
  if (!confirm("确定清空全部数据？")) return;
  state.series = [];
  state.dates = [];
  state.values = {};
  save(); render();
};
function exportImage(seriesFilter) {
  if (!state.dates.length || !state.series.length) {
    alert("请先添加日期和数据");
    return;
  }
  const seriesList = seriesFilter && seriesFilter.length
    ? seriesFilter.filter(s => state.series.includes(s))
    : state.series.slice();
  if (!seriesList.length) {
    alert("没有可导出的角色");
    return;
  }
  const single = seriesList.length === 1;
  const cols = ["日期"].concat(seriesList);
  const rows = state.dates.map(date => {
    return [fmtMD(date)].concat(seriesList.map(s => {
      const v = state.values[date] ? state.values[date][s] : "";
      return v == null || v === "" ? "-" : String(v);
    }));
  });

  const scale = 3;
  const width = single ? 1200 : 1600;
  const pad = 56;
  const titleH = 90;
  const colW = (width - pad * 2) / cols.length;
  const rowH = 52;
  const tableH = rowH * (rows.length + 1);
  const chartBoxW = width - pad * 2;
  const chartH = 720;
  const gap = 36;
  const height = pad + titleH + tableH + gap + chartH + pad;

  const canvas = document.createElement("canvas");
  canvas.width = width * scale;
  canvas.height = height * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = "#111827";
  ctx.font = "bold 40px PingFang SC, Noto Sans SC, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(single ? ("月矿统计 · " + seriesList[0]) : "月矿统计", width / 2, pad + 38);
  ctx.fillStyle = "#6b7280";
  ctx.font = "20px PingFang SC, Noto Sans SC, sans-serif";
  ctx.fillText(single ? "单角色数据表 + 折线图" : "数据表 + 折线图", width / 2, pad + 70);

  const tableX = pad;
  const tableY = pad + titleH;

  cols.forEach((c, i) => {
    const x = tableX + i * colW;
    ctx.fillStyle = "#f3f4f6";
    ctx.fillRect(x, tableY, colW, rowH);
    ctx.strokeStyle = "#d1d5db";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x, tableY, colW, rowH);
    ctx.fillStyle = "#111827";
    ctx.font = "bold 22px PingFang SC, Noto Sans SC, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(c, x + colW / 2, tableY + rowH / 2);
  });

  rows.forEach((r, ri) => {
    r.forEach((cell, i) => {
      const x = tableX + i * colW;
      const y = tableY + (ri + 1) * rowH;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x, y, colW, rowH);
      ctx.strokeStyle = "#d1d5db";
      ctx.strokeRect(x, y, colW, rowH);
      let color = "#111827";
      if (i > 0) {
        const sName = seriesList[i - 1];
        const si = Math.max(0, state.series.indexOf(sName));
        color = COLORS[si % COLORS.length];
      }
      ctx.fillStyle = color;
      ctx.font = (i === 0 ? "bold " : "") + "22px PingFang SC, Noto Sans SC, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(cell, x + colW / 2, y + rowH / 2);
    });
  });

  const hold = document.createElement("canvas");
  hold.width = chartBoxW;
  hold.height = chartH;
  hold.style.position = "fixed";
  hold.style.left = "-9999px";
  document.body.appendChild(hold);

  const hi = new Chart(hold, {
    type: "line",
    data: {
      labels: state.dates.map(fmtMD),
      datasets: buildDatasets(seriesList).map(ds => Object.assign({}, ds, { pointRadius: 6, borderWidth: 3 }))
    },
    plugins: [lineNamePlugin],
    options: {
      animation: false,
      responsive: false,
      maintainAspectRatio: false,
      devicePixelRatio: 3,
      layout: { padding: { right: 16, top: 40, left: 8, bottom: 8 } },
      plugins: { legend: { display: false } },
      scales: {
        x: { offset: true, ticks: { autoSkip: false, maxRotation: 0, color: "#374151", font: { size: 16 } } },
        y: { beginAtZero: false, grace: "8%", ticks: { color: "#374151", font: { size: 16 } } }
      }
    }
  });

  requestAnimationFrame(() => {
    const y = tableY + tableH + gap;
    ctx.drawImage(hold, pad, y, chartBoxW, chartH);
    downloadCanvas(canvas, single ? ("月矿统计-" + seriesList[0] + ".png") : "月矿统计.png");
    hi.destroy();
    hold.remove();
  });
}

function downloadCanvas(canvas, filename) {
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = filename || "月矿统计.png";
  a.click();
}

document.getElementById("exportImgBtn").onclick = () => exportImage();
document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "月矿统计.json";
  a.click();
};
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      state.series = parsed.series || [];
      state.dates = parsed.dates || [];
      state.values = parsed.values || {};
      save(); render();
    } catch { alert("JSON 格式不正确"); }
  };
  reader.readAsText(file);
  e.target.value = "";
};
